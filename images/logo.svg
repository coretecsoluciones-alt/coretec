<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 76" role="img" aria-label="CORETEC">
  <title>CORETEC</title>
  <defs>

    <!-- Outer C: diagonal metallic gradient (top-left bright → bottom-right shadow) -->
    <linearGradient id="gOC" x1="6" y1="5" x2="66" y2="71" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#E8F4FA"/>
      <stop offset="14%"  stop-color="#C4DDED"/>
      <stop offset="40%"  stop-color="#6FA0BB"/>
      <stop offset="72%"  stop-color="#3D7090"/>
      <stop offset="100%" stop-color="#1A4B66"/>
    </linearGradient>

    <!-- Inner C: slightly warmer metallic -->
    <linearGradient id="gIC" x1="22" y1="20" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#D4E8F4"/>
      <stop offset="38%"  stop-color="#78ACBF"/>
      <stop offset="100%" stop-color="#235470"/>
    </linearGradient>

    <!-- Edge highlight for outer C (adds bevel depth) -->
    <linearGradient id="gOCedge" x1="6" y1="5" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.30)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.00)"/>
    </linearGradient>

    <!-- Text: top-to-bottom white → steel blue -->
    <linearGradient id="gTxt" x1="0" y1="13" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="28%"  stop-color="#E4F0F8"/>
      <stop offset="65%"  stop-color="#B0CEDC"/>
      <stop offset="100%" stop-color="#78A8BE"/>
    </linearGradient>

  </defs>

  <!--
    ICON: Two concentric C-shapes, both opening to the right.
    Center: (38, 38)
    Gap angle: ±38° on each side
    cos(38°)=0.7880  sin(38°)=0.6157
  -->

  <!-- Outer C  — outer R=32, inner R=21 -->
  <!--   upper tip outer : (38+32×0.788, 38−32×0.616) = (63.2, 18.3) -->
  <!--   lower tip outer : (63.2, 57.7)                               -->
  <!--   upper tip inner : (38+21×0.788, 38−21×0.616) = (54.5, 25.1) -->
  <!--   lower tip inner : (54.5, 50.9)                               -->
  <path
    d="M 63.2,18.3
       A 32,32 0 1,0 63.2,57.7
       L 54.5,50.9
       A 21,21 0 1,1 54.5,25.1
       Z"
    fill="url(#gOC)"/>

  <!-- Outer C highlight overlay (thin bright sheen on upper edge) -->
  <path
    d="M 63.2,18.3
       A 32,32 0 1,0 63.2,57.7
       L 54.5,50.9
       A 21,21 0 1,1 54.5,25.1
       Z"
    fill="url(#gOCedge)"
    opacity="0.6"/>

  <!-- Inner C  — outer R=14, inner R=8.5 -->
  <!--   upper tip outer : (38+14×0.788, 38−14×0.616) = (49.0, 29.4) -->
  <!--   lower tip outer : (49.0, 46.6)                               -->
  <!--   upper tip inner : (38+8.5×0.788, 38−8.5×0.616) = (44.7, 32.8)-->
  <!--   lower tip inner : (44.7, 43.2)                               -->
  <path
    d="M 49.0,29.4
       A 14,14 0 1,0 49.0,46.6
       L 44.7,43.2
       A 8.5,8.5 0 1,1 44.7,32.8
       Z"
    fill="url(#gIC)"/>

  <!--
    TEXT: CORETEC
    font-size 34px, Inter Bold, wide letter-spacing
    Baseline y=50 → cap-top ≈ y=13 (aligns with gradient top)
  -->
  <text
    x="92" y="50"
    font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="34"
    font-weight="700"
    letter-spacing="7"
    fill="url(#gTxt)">CORETEC</text>

</svg>
